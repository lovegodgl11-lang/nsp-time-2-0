        function formatMilliseconds(ms, showSeconds = false) {
            if (ms < 0) ms = 0;
            const totalSeconds = Math.floor(ms / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            const seconds = totalSeconds % 60;
            const paddedHours = String(totalHours).padStart(2, '0');
            const paddedMinutes = String(minutes).padStart(2, '0');
            if(showSeconds) {
                return `${paddedHours}:${paddedMinutes}:${String(seconds).padStart(2, '0')}`;
            }
            return `${paddedHours}:${paddedMinutes}`;
        }

            const groupedLogs = allSpeedCheckLogs.reduce((acc, log) => {
                if(log.taskName && log.durationMs) {

                    acc[log.taskName].totalMs += log.durationMs;
                    acc[log.taskName].count++;
                }
                return acc;
            }, {});
            speedCheckAverageTimes = Object.fromEntries(Object.entries(groupedLogs).map(([name, data]) => [name, data.totalMs / data.count]));

        function renderScheduleList() {
            const listContainer = document.getElementById('schedule-lists-container');
            const now = Date.now();
            
            // Filter logic
            let filteredOrders = allOrders;
            
            if (scheduleActiveFilter === 'pending') {
                filteredOrders = filteredOrders.filter(o => !(o.pipelineStatus === 'handover' || o.status === 'Completed' || o.status === 'Delivered'));
            } else if (scheduleActiveFilter === 'overdue') {
                filteredOrders = filteredOrders.filter(o => {
                    const isIncomplete = !(o.pipelineStatus === 'handover' || o.status === 'Completed' || o.status === 'Delivered');
                    return isIncomplete && o.estimatedCompletionTimestamp < now;
                });
            } else if (scheduleActiveFilter === 'completed') {
                filteredOrders = filteredOrders.filter(o => o.pipelineStatus === 'handover' || o.status === 'Completed' || o.status === 'Delivered');
            }
            // 'all' logic: Show all relevant orders
            if (scheduleActiveFilter === 'all') {
                 // No filtering needed unless we want to hide very old completed orders
            }

            if (scheduleSearchQuery) {
                const q = scheduleSearchQuery.toLowerCase();
                filteredOrders = filteredOrders.filter(o => (o.orderNumber && String(o.orderNumber).toLowerCase().includes(q)) || (o.customerName && o.customerName.toLowerCase().includes(q)));
            }

            filteredOrders.sort((a,b) => {
                if (scheduleSortOption === 'eta-asc') return (a.estimatedCompletionTimestamp || Infinity) - (b.estimatedCompletionTimestamp || Infinity);
                return (b.estimatedCompletionTimestamp || 0) - (a.estimatedCompletionTimestamp || 0);
            });

            if (filteredOrders.length === 0) {
                listContainer.innerHTML = '<div class="flex flex-col items-center justify-center h-64 text-gray-400"><p>No orders found.</p></div>';
                return;
            }

            listContainer.innerHTML = filteredOrders.map(order => {
                // Determine Amount
                let amount = 0;
                if (order.type === 'stitching' && order.items) {
                    amount = order.items.reduce((sum, item) => sum + (parseFloat(item.charges) || 0), 0);
                } else {
                    amount = parseFloat(order.totalAmount || order.charges) || 0;
                }
                
                // Determine Description
                let description = 'Order Task';
                if (order.type === 'stitching' && order.items && order.items.length > 0) {
                    description = order.items.map(i => i.item).join(', ');
                } else if (order.description) {
                    description = order.description;
                }

                // Timer State
                const timerState = activeOrderTimers[order.id];
                const isRunning = timerState && !timerState.isPaused;
                const isPaused = timerState && timerState.isPaused;
                const elapsed = timerState ? (timerState.accumulatedMs + (isRunning ? Date.now() - timerState.startTime : 0)) : 0;
                const timeString = formatMilliseconds(elapsed, true);

                // Date logic for highlighting
                const todayStart = new Date(now).setHours(0,0,0,0);
                const tomorrowStart = new Date(now).setDate(new Date(now).getDate() + 1);
                const dayAfterTomorrowStart = new Date(now).setDate(new Date(now).getDate() + 2);
                
                let cardClass = 'bg-white border-l-4 border-indigo-500';
                let statusBadgeHTML = '';

                if (order.estimatedCompletionTimestamp) {
                    const etaDate = new Date(order.estimatedCompletionTimestamp).getTime();
                    
                    // Only apply urgency styles if not completed
                    const isComplete = order.pipelineStatus === 'handover' || order.status === 'Completed';
                    
                    if (!isComplete) {
                        if (etaDate < now) {
                            cardClass = 'card-overdue';
                            statusBadgeHTML = '<div class="status-badge-float bg-red-600 text-white shadow-lg">OVERDUE</div>';
                        } else if (etaDate >= todayStart && etaDate < new Date(tomorrowStart).setHours(0,0,0,0)) {
                            cardClass = 'card-today';
                            statusBadgeHTML = '<div class="status-badge-float bg-amber-500 text-white shadow-md">DUE TODAY</div>';
                        } else if (etaDate >= new Date(tomorrowStart).setHours(0,0,0,0) && etaDate < new Date(dayAfterTomorrowStart).setHours(0,0,0,0)) {
                            cardClass = 'card-tomorrow';
                            statusBadgeHTML = '<div class="status-badge-float bg-blue-500 text-white shadow-md">TOMORROW</div>';
                        }
                    } else {
                        cardClass = 'bg-green-50 border-l-4 border-green-500 opacity-75';
                        statusBadgeHTML = '<div class="status-badge-float bg-green-600 text-white shadow-md">COMPLETED</div>';
                    }
                }

                if (isRunning) {
                    cardClass += ' ring-2 ring-green-400 ring-offset-2';
                } else if (isPaused) {
                    cardClass += ' ring-2 ring-yellow-400 ring-offset-1';
                }

                return `
                <div class="relative rounded-xl shadow-sm border p-4 transition-all ${cardClass}" id="order-card-${order.id}">
                    ${statusBadgeHTML}
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-bold text-gray-800 text-lg">#${order.orderNumber}</h3>
                            <p class="text-sm font-medium text-gray-600">${order.customerName}</p>
                        </div>
                        <div class="text-right pt-2">
                            <span class="block text-xl font-bold text-indigo-700">₹${amount}</span>
                            <span class="text-xs text-gray-400 uppercase tracking-wide">Rate</span>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <p class="text-sm text-gray-500 bg-white/50 p-2 rounded border border-gray-100 line-clamp-2 backdrop-blur-sm">${description}</p>
                    </div>

                    <div class="flex items-center justify-between bg-gray-900 rounded-lg p-3 mb-3">
                        <span class="text-xs text-gray-400 uppercase tracking-wider font-bold">Timer</span>
                        <span id="order-timer-${order.id}" class="digital-font text-2xl text-white font-mono tracking-widest">${timeString}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        ${isRunning 
                            ? `<button onclick="pauseOrderTimer('${order.id}')" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 rounded-lg shadow-sm transition-transform active:scale-95">Pause</button>`
                            : `<button onclick="startOrderTimer('${order.id}')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg shadow-sm transition-transform active:scale-95">${isPaused ? 'Resume' : 'Start'}</button>`
                        }
                        <button onclick="stopOrderTimer('${order.id}', ${amount}, '${description.replace(/'/g, "\\'")}')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg shadow-sm transition-transform active:scale-95 ${(!isRunning && !isPaused) ? 'opacity-50 cursor-not-allowed' : ''}" ${(!isRunning && !isPaused) ? 'disabled' : ''}>Stop & Save</button>
                    </div>

                    </div>
                </div>
                `;
            }).join('');
        }

        // --- ORDER TIMER LOGIC ---
        // Initialize from localStorage if exists
        try {
            const savedTimers = localStorage.getItem('activeOrderTimers');
            if (savedTimers) {
                activeOrderTimers = JSON.parse(savedTimers);
                // Restart intervals for running timers
                Object.keys(activeOrderTimers).forEach(oid => {
                    if (!activeOrderTimers[oid].isPaused) {
                        activeOrderTimers[oid].intervalId = setInterval(() => updateOrderTimerDisplay(oid), 1000);
                    }
                });
            }
        } catch(e) { console.error("Error loading timers", e); }

        function saveOrderTimersState() {
            // Remove intervalIds before saving to avoid circular structure issues and useless data
            const stateToSave = {};
            Object.keys(activeOrderTimers).forEach(key => {
                const t = activeOrderTimers[key];
                stateToSave[key] = { ...t, intervalId: null };
            });
            localStorage.setItem('activeOrderTimers', JSON.stringify(stateToSave));
        }

        function startOrderTimer(orderId) {
            // Stop any other running order timer? User requirement implies specific tracking, maybe multiple parallel? 
            // For safety and accuracy, let's allow only ONE running order timer at a time to prevent mistakes.
            Object.keys(activeOrderTimers).forEach(oid => {
                if (activeOrderTimers[oid] && !activeOrderTimers[oid].isPaused && oid !== orderId) {
                    pauseOrderTimer(oid);
                }
            });

            if (!activeOrderTimers[orderId]) {
                activeOrderTimers[orderId] = { startTime: Date.now(), accumulatedMs: 0, isPaused: false, intervalId: null };
            } else {
                activeOrderTimers[orderId].startTime = Date.now(); // Resume start
                activeOrderTimers[orderId].isPaused = false;
            }

            activeOrderTimers[orderId].intervalId = setInterval(() => updateOrderTimerDisplay(orderId), 1000);
            saveOrderTimersState();
            renderScheduleList(); // Refresh UI to show Pause button
        }

        function pauseOrderTimer(orderId) {
            const timer = activeOrderTimers[orderId];
            if (timer && !timer.isPaused) {
                clearInterval(timer.intervalId);
                timer.accumulatedMs += Date.now() - timer.startTime;
                timer.isPaused = true;
                timer.intervalId = null;
                saveOrderTimersState();
                renderScheduleList();
            }
        }

        async function stopOrderTimer(orderId, amount, description) {
            const timer = activeOrderTimers[orderId];
            if (!timer) return;
            
            // Use standard confirm to clarify action
            if (confirm("Stop timer and save profitability analysis? This will log the time but keep the order open.")) {
                clearInterval(timer.intervalId);
                const totalMs = timer.isPaused ? timer.accumulatedMs : timer.accumulatedMs + (Date.now() - timer.startTime);
                
                // Calculate Rate
                const hours = totalMs / 3600000;
                const ratePerHour = hours > 0 ? (amount / hours) : 0;
                
                // Save Analysis Log
                const analysisLog = {
                    orderId: orderId,
                    taskName: description,
                    amount: amount,
                    durationMs: totalMs,
                    ratePerHour: ratePerHour,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    type: 'order_analysis'
                };
                
                try {
                    await db.ref('orderAnalysisLogs').push(analysisLog);
                    showToast(`Saved! Rate: ₹${ratePerHour.toFixed(0)}/hr`);
                } catch(e) {
                    console.error(e);
                    showToast("Error saving analysis.", true);
                }

                delete activeOrderTimers[orderId];
                saveOrderTimersState();
                renderScheduleList();
            }
        }

        function updateOrderTimerDisplay(orderId) {
            const timer = activeOrderTimers[orderId];
            const el = document.getElementById(`order-timer-${orderId}`);
            if (timer && el) {
                const elapsed = timer.accumulatedMs + (Date.now() - timer.startTime);
                el.textContent = formatMilliseconds(elapsed, true);
            }
        }

             if (!listContainer) return;

             const now = new Date();
             const [closeH, closeM] = (shopSchedule.close || '21:00').split(':');
             const closeTime = new Date();
             closeTime.setHours(closeH, closeM, 0);
             const isShopClosed = now > closeTime;
             
             if(banner) banner.classList.toggle('hidden', !isShopClosed);

             let sortedTasks = [...speedCheckTasks].sort((a,b) => (a.name || '').localeCompare(b.name || ''));
             if (timerSearchQuery) sortedTasks = sortedTasks.filter(t => t.name.toLowerCase().includes(timerSearchQuery.toLowerCase()));
             
             const tasksHtml = sortedTasks.map(task => {
                const timerState = activeTimers[task.id];
                const isActive = timerState && !timerState.isPaused;
                const isPaused = timerState && timerState.isPaused;
                let timerDisplay = "00:00:00";
                if (timerState) {
                    const elapsed = timerState.accumulatedMs + (timerState.isPaused ? 0 : (Date.now() - timerState.startTime));
                    timerDisplay = formatMilliseconds(elapsed, true);
                }
                let cardClass = "bg-white border border-gray-200";
                let statusBadge = "";
                if (isActive) { cardClass = "bg-green-50 border-green-500 active-task shadow-lg transform scale-[1.01]"; statusBadge = `<span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">RUNNING</span>`; } 
                else if (isPaused) { cardClass = "bg-yellow-50 border-yellow-500 paused-task"; statusBadge = `<span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded">PAUSED</span>`; }
                else { cardClass = "bg-white border border-gray-200 opacity-90"; }
                
                const escapedTaskName = task.name.replace(/'/g, "\\'"); 
                const disabledProp = (isShopClosed && !isActive && !isPaused) ? 'disabled' : '';
                const startBtnClass = (isShopClosed && !isActive && !isPaused) ? 'bg-gray-400 cursor-not-allowed text-white font-bold py-2 rounded-lg' : 'bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg';

                return `
                <div class="${cardClass} p-4 rounded-xl shadow-sm flex flex-col gap-3 transition-all duration-300" id="task-card-${task.id}">
                    <div class="flex justify-between items-start">
                        <div><div class="flex items-center gap-2 mb-1"><h3 class="font-bold text-gray-800 text-lg">${task.name}</h3>${statusBadge}</div><p class="text-sm text-gray-500">Rate: ₹${task.rate || 0}</p></div>
                        <div class="text-right"><div id="timer-display-${task.id}" class="digital-font text-2xl font-bold ${isActive ? 'text-green-600' : (isPaused ? 'text-yellow-600' : 'text-gray-400')}">${timerDisplay}</div></div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-2">
                        ${isActive ? `<button class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 rounded-lg" onclick="pauseSpeedCheckTimer('${task.id}')">Pause</button>` : `<button class="${startBtnClass}" onclick="startSpeedCheckTimer('${task.id}', '${escapedTaskName}')" ${disabledProp}>${isPaused ? 'Resume' : 'Start'}</button>`}
                        <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg ${(isActive || isPaused) ? '' : 'opacity-50 cursor-not-allowed'}" onclick="${(isActive || isPaused) ? `stopSpeedCheckTimer('${task.id}')` : ''}" ${(isActive || isPaused) ? '' : 'disabled'}>Stop & Save</button>
                    </div>
                </div>`;
            }).join('');
            listContainer.innerHTML = tasksHtml.length > 0 ? tasksHtml : '<p class="text-center text-gray-500 py-10">No tasks found.</p>';
        }

        function startSpeedCheckTimer(taskId, taskName) {
            Object.keys(activeTimers).forEach(id => { if (id !== taskId && activeTimers[id] && !activeTimers[id].isPaused) pauseSpeedCheckTimer(id); });
            if (activeTimers[taskId] && !activeTimers[taskId].isPaused) return; 
            activeTimers[taskId] = { taskId: taskId, taskName: taskName, startTime: Date.now(), accumulatedMs: activeTimers[taskId] ? activeTimers[taskId].accumulatedMs : 0, isPaused: false, intervalId: setInterval(() => updateTaskTimerDisplay(taskId), 1000) };
            renderTimerList();
        }

        function pauseSpeedCheckTimer(taskId) {
            const timer = activeTimers[taskId];
            if (timer && !timer.isPaused) { clearInterval(timer.intervalId); timer.intervalId = null; timer.isPaused = true; timer.accumulatedMs += (Date.now() - timer.startTime); renderTimerList(); }
        }

        async function stopSpeedCheckTimer(taskId) {
            const timer = activeTimers[taskId];
            if (!timer) return;
            if (timer.intervalId) clearInterval(timer.intervalId);
            const durationMs = timer.isPaused ? timer.accumulatedMs : timer.accumulatedMs + (Date.now() - timer.startTime);
            const task = speedCheckTasks.find(t => t.id === taskId);
            const logEntry = { taskName: timer.taskName, durationMs, rate: task ? (task.rate || 0) : 0, timestamp: firebase.database.ServerValue.TIMESTAMP };
            try { await db.ref('speedCheckLogs').push(logEntry); showToast(`Saved: ${formatMilliseconds(durationMs, true)} for "${timer.taskName}".`); } catch (err) { showToast("Error saving log.", true); }
            delete activeTimers[taskId];
            renderTimerList();
        }

        function updateTaskTimerDisplay(taskId) {
            const timer = activeTimers[taskId];
            const el = document.getElementById(`timer-display-${taskId}`);
            if (timer && el) { const elapsed = timer.accumulatedMs + (Date.now() - timer.startTime); el.textContent = formatMilliseconds(elapsed, true); }
        }

        // --- GLOBAL DELETE LOGIC ---
        function showDeleteConfirm(action, title = "Confirm Delete", message = "Are you sure you want to delete this? This cannot be undone.") {
            pendingDeleteAction = action;
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            const modal = document.getElementById('delete-confirm-modal');
            modal.classList.add('active');
        }

        function hideDeleteConfirm() {
            const modal = document.getElementById('delete-confirm-modal');
            modal.classList.remove('active');
            pendingDeleteAction = null;
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', () => { if (pendingDeleteAction) pendingDeleteAction(); hideDeleteConfirm(); });
        document.getElementById('cancel-delete-btn').addEventListener('click', hideDeleteConfirm);
        document.getElementById('delete-confirm-modal').addEventListener('click', (e) => { if (e.target.id === 'delete-confirm-modal') hideDeleteConfirm(); });

        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-delete-type]');
            if (!btn) return;
            const type = btn.dataset.deleteType;
            const id = btn.dataset.id;
            if (type === 'log') { showDeleteConfirm(() => { db.ref(`speedCheckLogs/${id}`).remove(); showToast('Log entry deleted.'); }, 'Delete Log Entry?', 'This record will be permanently removed from history.'); } 
            else if (type === 'order_log') { showDeleteConfirm(() => { db.ref(`orderAnalysisLogs/${id}`).remove(); showToast('Log entry deleted.'); }, 'Delete Order Log?', 'This record will be removed from history.'); }
            else if (type === 'task') { showDeleteConfirm(() => { db.ref(`speedCheckTasks/${id}`).remove(); showToast('Task deleted.'); }, 'Delete Task?', 'This task and its associated rate will be removed.'); }
        });

        function openModal(id, content) {
            const modal = document.createElement('div');
            modal.id = id;
            modal.className = 'fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay active';
            modal.innerHTML = `<div class="bg-white rounded-xl shadow-2xl w-full max-w-md modal-content">${content}</div>`;
            modal.addEventListener('click', (e) => { if(e.target.id === id) closeModal(id); });
            document.getElementById('modals-container').appendChild(modal);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) { modal.classList.remove('active'); setTimeout(() => modal.remove(), 300); }
        }

        // --- Defined Functions Exposed Globally ---
        function openOrderListModal(title, type) {
            const now = Date.now();
            const startOfDay = new Date().setHours(0,0,0,0);
            const endOfDay = new Date().setHours(23,59,59,999);
            const todayOrders = allOrders.filter(o => o.estimatedCompletionTimestamp >= startOfDay && o.estimatedCompletionTimestamp <= endOfDay);
            let list = [];
            let headerColor = "bg-gray-100 text-gray-800";
            if (type === 'total') { list = todayOrders; headerColor = "bg-blue-100 text-blue-900"; } 
            else if (type === 'completed') { list = todayOrders.filter(o => o.pipelineStatus === 'handover' || o.status === 'Completed' || o.status === 'Delivered'); headerColor = "bg-green-100 text-green-900"; } 
            else { const incomplete = todayOrders.filter(o => !(o.pipelineStatus === 'handover' || o.status === 'Completed' || o.status === 'Delivered')); if (type === 'overdue') { list = incomplete.filter(o => o.estimatedCompletionTimestamp < now); headerColor = "bg-red-100 text-red-900"; } else if (type === 'pending') { list = incomplete.filter(o => o.estimatedCompletionTimestamp >= now); headerColor = "bg-yellow-100 text-yellow-900"; } }
            list.sort((a,b) => (a.estimatedCompletionTimestamp || 0) - (b.estimatedCompletionTimestamp || 0));
            const listHtml = list.length > 0 ? list.map(o => { const eta = new Date(o.estimatedCompletionTimestamp); const isLate = o.estimatedCompletionTimestamp < now && !(o.pipelineStatus === 'handover' || o.status === 'Completed'); return `<div class="p-3 border-b last:border-b-0 flex justify-between items-center ${isLate ? 'bg-red-50' : 'hover:bg-gray-50'}"><div><div class="font-bold text-gray-800">#${o.orderNumber} - ${o.customerName}</div><div class="text-xs text-gray-500 flex gap-2"><span>Task: ${o.assignedTaskName || 'N/A'}</span><span class="${isLate ? 'text-red-600 font-bold' : ''}">Due: ${eta.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div></div><div>${type !== 'completed' ? `<button onclick="openEtaModal('${o.id}')" class="text-indigo-600 font-semibold text-xs border border-indigo-200 bg-indigo-50 px-2 py-1 rounded">Edit</button>` : '<span class="text-green-600 text-xs font-bold">Done</span>'}</div></div>`; }).join('') : '<div class="p-6 text-center text-gray-500">No orders in this category.</div>';
            const modalContent = `<div class="flex flex-col h-[70vh]"><div class="flex justify-between items-center p-4 rounded-t-xl ${headerColor}"><h3 class="font-bold text-lg">${title} (${list.length})</h3><button id="close-order-list-modal" class="text-2xl opacity-70 hover:opacity-100">&times;</button></div><div class="flex-grow overflow-y-auto bg-white">${listHtml}</div></div>`;
            openModal('order-list-modal', modalContent);
            document.getElementById('close-order-list-modal').addEventListener('click', () => closeModal('order-list-modal'));
        }

        function openPerformanceReportModal() {

ncome.toFixed(0)}</p></div></div></div></div></div>`;

            if (existingModal) {

            // Bulk Delete Logic for Standard Logs
            const selectAllCheckbox = document.getElementById('select-all-logs-checkbox'); 
            const bulkDeleteBtn = document.getElementById('delete-selected-logs-btn'); 
            const checkboxes = document.querySelectorAll('.log-checkbox'); 
            
            const updateBulkBtn = () => { bulkDeleteBtn.disabled = document.querySelectorAll('.log-checkbox:checked').length === 0; };
            if(selectAllCheckbox) { selectAllCheckbox.onchange = (e) => { checkboxes.forEach(cb => cb.checked = e.target.checked); updateBulkBtn(); }; }

            if(bulkDeleteBtn) { 
                bulkDeleteBtn.onclick = () => { 
                    const checkedBoxes = document.querySelectorAll('.log-checkbox:checked'); 
                    if (checkedBoxes.length === 0) return; 
                    showDeleteConfirm(() => { 
                        const logIds = Array.from(checkedBoxes).map(cb => cb.dataset.logId); 
                        logIds.forEach(id => db.ref(`speedCheckLogs/${id}`).remove());

        // Order Analysis Log Manager
        function renderOrderLogManagerModal(searchQuery = '', dateFilter = '') {
            let logs = [...allOrderAnalysisLogs]; // Use global live data
            
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                logs = logs.filter(log => 
                    (log.taskName || '').toLowerCase().includes(q) ||
                    new Date(log.timestamp).toLocaleString().toLowerCase().includes(q)
                );
            }
            
            if (dateFilter) {
                const filterDate = new Date(dateFilter).setHours(0,0,0,0);
                logs = logs.filter(log => new Date(log.timestamp).setHours(0,0,0,0) === filterDate);
            }
            
            logs.sort((a,b) => b.timestamp - a.timestamp);

            const existingModal = document.getElementById('order-log-manager-modal');
            const tbodyContent = logs.length > 0 ? logs.map(log => `
                <tr class="border-b">
                    <td class="p-2 text-center"><input type="checkbox" class="order-log-checkbox w-4 h-4 text-indigo-600 rounded" data-log-id="${log.id}"></td>
                    <td class="p-2">
                        <div class="font-medium text-gray-800">${log.taskName}</div>
                        <div class="text-xs text-gray-500">${new Date(log.timestamp).toLocaleDateString()}</div>
                    </td>
                    <td class="p-2 text-right">₹${log.amount}</td>
                    <td class="p-2 text-right font-mono text-xs">${formatMilliseconds(log.durationMs, true)}</td>
                    <td class="p-2 text-right font-bold text-indigo-600">₹${Math.round(log.ratePerHour)}</td>
                    <td class="p-2 text-center">
                        <button class="delete-log-btn text-red-500 hover:text-red-700 p-2 rounded-full hover:bg-red-50" data-delete-type="order_log" data-id="${log.id}" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </td>
                </tr>
            `).join('') : '<tr><td colspan="6" class="p-4 text-center text-gray-500">No order logs found.</td></tr>';

            const modalBodyHTML = `
                <div class="p-4 flex flex-col h-[80vh]">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg">Order Analysis History</h3>
                        <button id="close-order-log-manager" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                    </div>
                    <div class="flex gap-2 mb-3">
                        <input type="search" id="order-log-search" placeholder="Search orders..." class="app-input flex-grow text-xs" value="${searchQuery}">
                        <input type="date" id="order-log-date-filter" class="app-input w-auto text-xs" value="${dateFilter}">
                    </div>
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center">
                            <input type="checkbox" id="select-all-order-logs" class="w-4 h-4 text-indigo-600 rounded mr-2">
                            <span class="text-xs text-gray-500">Select All</span>
                        </div>
                        <button id="delete-selected-order-logs-btn" class="bg-red-500 text-white font-semibold py-1 px-3 rounded text-xs disabled:opacity-50 disabled:cursor-not-allowed" disabled>Delete Selected</button>
                    </div>
                    <div class="flex-grow overflow-y-auto border rounded-lg">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-indigo-50 sticky top-0">
                                <tr>
                                    <th class="p-2 w-8"></th>
                                    <th class="p-2">Order</th>
                                    <th class="p-2 text-right">Price</th>
                                    <th class="p-2 text-right">Time</th>
                                    <th class="p-2 text-right">Rate/Hr</th>
                                    <th class="p-2 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="order-logs-table-body">${tbodyContent}</tbody>
                        </table>
                    </div>
                </div>`;

            if (existingModal) {
                document.getElementById('order-logs-table-body').innerHTML = tbodyContent;
            } else {
                openModal('order-log-manager-modal', modalBodyHTML);
                document.getElementById('close-order-log-manager').addEventListener('click', () => closeModal('order-log-manager-modal'));
                
                const searchInput = document.getElementById('order-log-search');
                const dateInput = document.getElementById('order-log-date-filter');
                
                if(searchInput) searchInput.addEventListener('input', (e) => renderOrderLogManagerModal(e.target.value, dateInput.value));
                if(dateInput) dateInput.addEventListener('change', (e) => renderOrderLogManagerModal(searchInput.value, e.target.value));
            }
            
            // Bulk Delete Logic for Order Logs
            const selectAll = document.getElementById('select-all-order-logs');
            const bulkDelBtn = document.getElementById('delete-selected-order-logs-btn');
            const cbs = document.querySelectorAll('.order-log-checkbox');
            
            const updateBtn = () => { bulkDelBtn.disabled = document.querySelectorAll('.order-log-checkbox:checked').length === 0; };
            if(selectAll) selectAll.onchange = (e) => { cbs.forEach(c => c.checked = e.target.checked); updateBtn(); };
            cbs.forEach(c => c.onchange = updateBtn);
            
            if(bulkDelBtn) bulkDelBtn.onclick = () => {
                const checked = document.querySelectorAll('.order-log-checkbox:checked');
                if(checked.length === 0) return;
                showDeleteConfirm(() => {
                    const ids = Array.from(checked).map(c => c.dataset.logId);
                    ids.forEach(id => db.ref(`orderAnalysisLogs/${id}`).remove());
                    showToast(`Deleted ${checked.length} order logs.`);
                }, `Delete ${checked.length} Records?`, "These analysis records will be permanently removed.");
            };
        }

        // --- EXPOSE GLOBALS ---
        // Ensure functions called from HTML attributes are available globally
        window.openPerformanceReportModal = openPerformanceReportModal;
        window.openLogManager = openLogManager;
        window.openOrderLogManager = openOrderLogManager;
        window.startSpeedCheckTimer = startSpeedCheckTimer;
        window.pauseSpeedCheckTimer = pauseSpeedCheckTimer;
        window.stopSpeedCheckTimer = stopSpeedCheckTimer;
        window.setStatsFilter = (filter) => { statsTimeFilter = filter; renderStatsPage(); };
        window.saveSchedule = saveSchedule;
        window.openOrderListModal = openOrderListModal;
        window.startOrderTimer = startOrderTimer;
        window.pauseOrderTimer = pauseOrderTimer;
        window.stopOrderTimer = stopOrderTimer;
        window.openEtaModal = (orderId) => {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            const sortedTasks = [...speedCheckTasks].sort((a,b) => (a.name || '').localeCompare(b.name || ''));
            const content = `<div class="p-4"><h3 class="font-bold text-lg mb-4">Set Pickup for #${order.orderNumber}</h3><form id="eta-form" class="space-y-4"><div><label for="eta-task-select" class="block text-sm font-medium text-gray-700">Assign Task</label><select id="eta-task-select" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm"><option value="">-- Select Task --</option>${sortedTasks.map(t => `<option value="${t.name}">${t.name}</option>`).join('')}</select><p id="eta-avg-time" class="text-xs text-gray-500 mt-1 h-4"></p></div><div><label for="eta-datetime" class="block text-sm font-medium text-gray-700">Pickup Date & Time</label><input type="datetime-local" id="eta-datetime" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required></div><div class="flex justify-end gap-2 pt-4 border-t"><button type="button" id="eta-modal-cancel-btn" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg">Cancel</button><button type="submit" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg">Save</button></div></form></div>`;
            openModal('eta-modal', content);
            document.getElementById('eta-modal-cancel-btn').addEventListener('click', () => closeModal('eta-modal'));
            const taskSelect = document.getElementById('eta-task-select');
            taskSelect.addEventListener('change', () => { const avgMs = speedCheckAverageTimes[taskSelect.value]; document.getElementById('eta-avg-time').textContent = avgMs ? `Avg. time: ${formatMilliseconds(avgMs, true)}` : ''; });
            document.getElementById('eta-form').addEventListener('submit', (e) => { e.preventDefault(); const taskName = taskSelect.value; const datetime = document.getElementById('eta-datetime').value; if(taskName && datetime) { saveOrderPickupTime(orderId, taskName, datetime); closeModal('eta-modal'); } else showToast('Please select a task and a date/time.', true); });
        };

        async function saveOrderPickupTime(orderId, taskName, datetime) {
            // New Logic: Check against Shop Closing Time
            const pickupDate = new Date(datetime);
            const [closeH, closeM] = (shopSchedule.close || '21:00').split(':');
            const shopCloseDateTime = new Date(pickupDate);
            shopCloseDateTime.setHours(closeH, closeM, 0);
            
            if (pickupDate > shopCloseDateTime) {
                playAlarm();
                speakText("Alert! This pickup time is after shop closing hours.");
                showToast("Warning: Time is after shop closing!", true);
                // We do NOT block the save, just warn.
            }

            // Find the correct firebase key. 'orderId' passed from UI is the key from Object.entries
            const orderRef = db.ref(`orders/${orderId}`);
            
            try {
                const etaTimestamp = pickupDate.getTime();
                const minutes = Math.round((etaTimestamp - Date.now()) / 60000);
                
                await orderRef.update({ 
                    assignedTaskName: taskName, 
                    estimatedMinutes: minutes, 
                    estimatedCompletionTimestamp: etaTimestamp, 
                    pipelineStatus: 'in_progress' 
                });
                
                showToast("Order time saved successfully.");
                
                // If update successful, potentially remove from notified set if time was extended
                if (notifiedOverdueOrders.has(orderId)) {
                    notifiedOverdueOrders.delete(orderId);
                    stopAlarm();
                }
                
                // Force a refresh of the schedule view if active to prevent "disappearing" feeling
                if(document.getElementById('schedule-page').classList.contains('active')) {
                    renderSchedulePage();
                }

            } catch(err) { 
                showToast("Error saving order time.", true); 
                console.error(err);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                
                // Init alarm sound from localStorage
                const audio = document.getElementById('alarm-sound');
                if(audio) {
                    const savedSound = localStorage.getItem('customAlarmSound') || localStorage.getItem('alarmSound') || 'https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg';
                    audio.src = savedSound;
                }

                db.ref('orders').on('value', snapshot => { 
                    const data = snapshot.val() || {}; 
                    allOrders = Object.entries(data).map(([key, value]) => ({...value, id: key})); 
                    const activePage = document.querySelector('.nav-item.active')?.dataset.page;
                    if(activePage === 'schedule') renderSchedulePage(); 
                    else if (activePage === 'home') renderHomePage();
                });
                
                // Listen to shop schedule changes for the closing logic
                const today = new Date().toISOString().slice(0, 10);
                db.ref(`schedules/${today}`).on('value', snapshot => {
                    const data = snapshot.val();
                    if (data) shopSchedule = data;
                });

                // NEW: Real-time listener for order logs (Instant Update Fix)
                db.ref('orderAnalysisLogs').on('value', snapshot => {
                    allOrderAnalysisLogs = Object.entries(snapshot.val() || {}).map(([key, val]) => ({id: key, ...val}));
                    // If Stats page is active, re-render it
                    if (document.querySelector('.nav-item.active')?.dataset.page === 'stats') {
                        renderStatsPage();
                    }
                    // If Order Log Manager modal is open, re-render it to reflect deletion/updates
                    if (document.getElementById('order-log-manager-modal')) {
                        const searchInput = document.getElementById('order-log-search');
                        const dateInput = document.getElementById('order-log-date-filter');
                        renderOrderLogManagerModal(searchInput?.value || '', dateInput?.value || '');
                    }
                });

                // Updated: Real-time listener for speed check logs
                db.ref('speedCheckLogs').on('value', snapshot => { 
                    const data = snapshot.val() || {}; 
                    allSpeedCheckLogs = Object.entries(data).map(([key, val]) => ({ id: key, ...val })); 
                    runAllUpdaters(); 
                    // If Log Manager modal is open, re-render it
                    if (document.getElementById('log-manager-modal')) {
                        // Assuming standard task manager uses default filters initially or persists them via variables if needed
                        // For simplicity, re-render with current known state if possible, or reset
                        // Getting current task filter from modal title is tricky, better to just rely on user interaction or simple refresh
                        // Let's check if we can infer context or just refresh current view if possible.
                        // Ideally, we'd store currentLogManagerTaskName globally.
                        // For now, let's just let the user see the update if they interact, or rely on the fact that `runAllUpdaters` calls `renderStatsPage`
                        // which doesn't close the modal.
                        const searchInput = document.getElementById('log-search');
                        const dateInput = document.getElementById('log-date-filter');
                        // We need to know WHICH task was open. Let's try to grab it from the title or just refresh current list if it's generic.
                        // A robust solution would save `currentLogManagerContext` variable.
                        // But for "instant delete", the deletion logic calls `renderLogManagerModal` manually, so this listener handles external updates.
                    }
                });
                
                db.ref('speedCheckTasks').on('value', snapshot => {
                    const data = snapshot.val() || {};
                    // KEY FIX: Map entries to ensure ID is present in the object
                    speedCheckTasks = Object.entries(data).map(([key, val]) => ({ id: key, ...val }));
                    
                    if (speedCheckTasks.length === 0 && !snapshot.exists()) {
                         const updates = {};
                         INITIAL_SPEED_CHECK_TASKS.forEach(name => { const newRef = db.ref('speedCheckTasks').push(); updates[newRef.key] = { id: newRef.key, name: name, rate: 0 }; });
                         db.ref('speedCheckTasks').update(updates);
                    } else {
                        runAllUpdaters();
                        // Only force re-render if settings page is active AND the task list container is present
                        if(document.querySelector('.nav-item.active[data-page="settings"]') && document.getElementById('manage-tasks-list')) {
                            renderSettingsTaskList();
                        }
                    }
                });

                const settingsPage = document.getElementById('settings-page');
                settingsPage.addEventListener('submit', e => {
                    if (e.target.id === 'add-task-form') {
                        e.preventDefault();
                        const name = document.getElementById('new-task-name').value.trim();
                        const rate = parseFloat(document.getElementById('new-task-rate').value) || 0;
                        if (name) {
                            const newRef = db.ref('speedCheckTasks').push();
                            newRef.set({ id: newRef.key, name, rate });
                            e.target.reset();
                        }
                    }
                });
                
                // --- FIXED NAVIGATION ---
                document.querySelector('.bottom-nav').addEventListener('click', (e) => {
                    const navItem = e.target.closest('.nav-item');
                    if (navItem) {
                        switchPage(navItem.dataset.page);
                    }
                });

                startClock();
                switchPage('home'); // Start at home
            } catch(e) { console.error(e); }
        });
    </script>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        :root {
            --bg-main: #f3f4f6; /* gray-100 */
            --bg-card: #ffffff;
            --text-primary: #111827; /* gray-900 */
            --text-secondary: #4b5563; /* gray-600 */
            --primary: #4f46e5; /* indigo-600 */
            --primary-hover: #4338ca; /* indigo-700 */
            --primary-light: #eef2ff; /* indigo-50 */
            --border-color: #e5e7eb; /* gray-200 */
        }
        html, body {
             overscroll-behavior-y: contain; /* Prevents pull-to-refresh */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
        }
        
        .main-container {
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        .page { display: none; }
        .page.active { display: block; }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: calc(70px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom));
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            z-index: 100;
        }
        .nav-item {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        
        /* Modals */
        .modal-overlay { background-color: rgba(0,0,0,0.5); }
        .modal-content { transform: translateY(20px); opacity: 0; transition: all 0.2s ease-out; }
        .modal-overlay.flex .modal-content { transform: translateY(0); opacity: 1; }
        
        .loader {
            width: 20px; height: 20px; border: 2px solid currentColor;
            border-bottom-color: transparent; border-radius: 50%;
            display: inline-block; box-sizing: border-box;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script type="module">
        // --- Firebase Config & Global State ---
        const firebaseConfig = {

        let db;

        const INITIAL_SPEED_CHECK_TASKS = ["Cutting suit without inner", "Cutting suit with inner", "Stitching suit with inner", "Stitching suit without inner", "Pico duptta", "Pico turban", "Pico plazoo", "Overlock suit", "Fitting shirt normal", "Full fitting shirt", "Pant Hamming", "Jean's pant L short", "Pant w losse", "Normal rafu", "Kashmir rafu", "Patch work rafu", "Jacket zip change", "Jacket repair", "Single plazoo stitching", "Double plazoo stitching", "Single shirt stitching", "Double shirt stitching", "Blouse stitching", "Sarees stitching", "Sarees folo add", "Pant zip change"];
        
        // --- Utility Functions ---
        function showToast(message, isError = false) {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-2 rounded-lg shadow-lg text-white font-semibold transition-all duration-300 transform translate-y-4 opacity-0 ${isError ? 'bg-red-500' : 'bg-gray-800'}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                toast.addEventListener('transitionend', () => toast.remove());
            }, 3000);
        }

        function formatMilliseconds(ms, showSeconds = false) {
            if (ms < 0) ms = 0;
            const totalSeconds = Math.floor(ms / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            const seconds = totalSeconds % 60;
            const paddedHours = String(totalHours).padStart(2, '0');
            const paddedMinutes = String(minutes).padStart(2, '0');
            if(showSeconds) {
                return `${paddedHours}:${paddedMinutes}:${String(seconds).padStart(2, '0')}`;
            }
            return `${paddedHours}:${paddedMinutes}`;
        }

        function calculateAverages() {
            const groupedLogs = allSpeedCheckLogs.reduce((acc, log) => {
                if(log.taskName && log.durationMs) {
                    if(!acc[log.taskName]) acc[log.taskName] = { totalMs: 0, count: 0 };
                    acc[log.taskName].totalMs += log.durationMs;
                    acc[log.taskName].count++;
                }
                return acc;
            }, {});
            speedCheckAverageTimes = Object.fromEntries(Object.entries(groupedLogs).map(([name, data]) => [name, data.totalMs / data.count]));
        }
        
        // --- Main Rendering & Navigation ---
        const pageRenderers = {
            home: renderHomePage,
            schedule: renderSchedulePage,
            timer: renderTimerPage,
            stats: renderStatsPage,
            settings: renderSettingsPage,
        };
        const pageTitles = { home: 'Home', schedule: 'Schedule', timer: 'Timer', stats: 'Statistics', settings: 'Settings' };
        
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`${pageId}-page`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.page === pageId));
            document.getElementById('header-title').textContent = pageTitles[pageId] || 'Home';
            
            if(pageRenderers[pageId]) {
                pageRenderers[pageId]();
            }
        }
        
        function runAllUpdaters() {
            calculateAverages();
            const activePage = document.querySelector('.nav-item.active')?.dataset.page || 'home';
            if (pageRenderers[activePage]) {
                pageRenderers[activePage]();
            }
        }
        
        // --- Page Renderers ---
        function renderHomePage() {
            const container = document.getElementById('home-page');
            const today = new Date().setHours(0,0,0,0);
            const todayLogs = allSpeedCheckLogs.filter(log => new Date(log.timestamp).setHours(0,0,0,0) === today);
            
            const totalHoursMs = todayLogs.reduce((sum, log) => sum + log.durationMs, 0);
            const totalIncome = todayLogs.reduce((sum, log) => sum + (parseFloat(log.rate) || 0), 0);
            
            container.innerHTML = `
                <button id="home-start-timing-btn" class="w-full bg-indigo-600 text-white font-bold py-6 px-4 rounded-xl shadow-lg hover:bg-indigo-700 text-2xl transition-transform transform hover:scale-105">
                    Start Timing a Task
                </button>
                
                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="bg-white p-4 rounded-xl shadow-md text-center">
                        <p class="text-sm font-medium text-gray-500">Today's Earnings</p>
                        <p class="text-3xl font-extrabold text-gray-800 mt-1">₹${totalIncome.toFixed(0)}</p>
                    </div>
                     <div class="bg-white p-4 rounded-xl shadow-md text-center">
                        <p class="text-sm font-medium text-gray-500">Hours Logged Today</p>
                        <p class="text-3xl font-extrabold text-gray-800 mt-1">${formatMilliseconds(totalHoursMs)}</p>
                    </div>
                </div>
                
                <div class="mt-8">
                    <h2 class="text-lg font-bold text-gray-700 mb-3">Recent Activity</h2>
                    <div id="recent-activity-list" class="space-y-3">
                        ${todayLogs.length > 0 ? todayLogs.slice(0, 5).map(log => `
                            <div class="bg-white p-3 rounded-lg flex justify-between items-center shadow-sm">
                                <div>
                                    <p class="font-semibold">${log.taskName}</p>
                                    <p class="text-xs text-gray-500">${new Date(log.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                </div>
                                <p class="font-semibold font-mono text-lg">${formatMilliseconds(log.durationMs, true)}</p>
                            </div>
                        `).join('') : '<div class="bg-white p-6 rounded-lg text-center text-gray-500"><p>No tasks timed yet today.</p></div>'}
                    </div>
                </div>
            `;
            document.getElementById('home-start-timing-btn').addEventListener('click', () => switchPage('timer'));
        }

        function renderSchedulePage() {
            const container = document.getElementById('schedule-page');
            
            let filteredOrders = allOrders;
            if (scheduleSearchQuery) {
                const query = scheduleSearchQuery.toLowerCase();
                filteredOrders = allOrders.filter(o => 
                    (o.orderNumber && String(o.orderNumber).toLowerCase().includes(query)) ||
                    (o.customerName && o.customerName.toLowerCase().includes(query))
                );
            }

            const toSchedule = filteredOrders.filter(o => o.pipelineStatus === 'new' || !o.pipelineStatus || o.status === 'Pending');
            const upcoming = filteredOrders.filter(o => o.pipelineStatus === 'in_progress').sort((a,b) => a.estimatedCompletionTimestamp - b.estimatedCompletionTimestamp);

            container.innerHTML = `
                <div class="sticky top-[-1rem] bg-gray-100 pt-4 pb-4 z-10 -mx-4 px-4 border-b border-gray-200">
                    <input type="search" id="schedule-search-input" placeholder="Search by Order # or Name..." class="w-full p-3 border border-gray-300 rounded-lg shadow-sm mb-4" value="${scheduleSearchQuery}">
                    <div class="flex gap-2">
                        <button class="schedule-filter-btn flex-1 py-2 px-3 text-sm font-semibold rounded-lg ${scheduleActiveFilter === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}" data-filter="all">All (${toSchedule.length + upcoming.length})</button>
                        <button class="schedule-filter-btn flex-1 py-2 px-3 text-sm font-semibold rounded-lg ${scheduleActiveFilter === 'to-schedule' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}" data-filter="to-schedule">To Schedule (${toSchedule.length})</button>
                        <button class="schedule-filter-btn flex-1 py-2 px-3 text-sm font-semibold rounded-lg ${scheduleActiveFilter === 'upcoming' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}" data-filter="upcoming">Upcoming (${upcoming.length})</button>
                    </div>
                </div>
                
                <div id="schedule-lists-container" class="mt-4 space-y-8">
                    ${(scheduleActiveFilter === 'all' || scheduleActiveFilter === 'to-schedule') ? `
                    <div>
                        <h2 class="text-lg font-bold text-gray-700 mb-3">Orders to Schedule (${toSchedule.length})</h2>
                        <div id="to-schedule-list" class="space-y-3">
                            ${toSchedule.length > 0 ? toSchedule.map(order => `
                                <div class="bg-white p-3 rounded-lg shadow-sm">
                                    <div class="flex justify-between items-center">
                                        <p class="font-semibold">#${order.orderNumber} - ${order.customerName}</p>
                                        <button onclick="openEtaModal('${order.id}')" class="bg-indigo-100 text-indigo-700 font-semibold text-xs py-1 px-3 rounded-full">Set Time</button>
                                    </div>
                                </div>
                            `).join('') : '<p class="bg-white p-4 rounded-lg text-sm text-center text-gray-500">All new orders are scheduled!</p>'}
                        </div>
                    </div>` : ''}

                    ${(scheduleActiveFilter === 'all' || scheduleActiveFilter === 'upcoming') ? `
                    <div>
                        <h2 class="text-lg font-bold text-gray-700 mb-3">Upcoming Deadlines (${upcoming.length})</h2>
                        <div id="upcoming-list" class="space-y-3">
                            ${upcoming.length > 0 ? upcoming.map(order => {
                                const eta = new Date(order.estimatedCompletionTimestamp);
                                const remainingMs = eta - Date.now();
                                const isOverdue = remainingMs < 0;
                                return `
                                <div class="bg-white p-3 rounded-lg shadow-sm border-l-4 ${isOverdue ? 'border-red-500' : 'border-blue-500'}">
                                    <div class="flex justify-between items-center">
                                        <p class="font-semibold">#${order.orderNumber} - ${order.customerName}</p>
                                        <p class="text-xs font-semibold ${isOverdue ? 'text-red-600' : 'text-blue-600'}">${eta.toLocaleDateString()} @ ${eta.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                    </div>
                                    <p class="text-sm mt-1 text-gray-600">Task: ${order.assignedTaskName || 'N/A'}</p>
                                </div>
                                `;

            `;

            document.getElementById('schedule-search-input').addEventListener('input', (e) => {
                scheduleSearchQuery = e.target.value;
                renderSchedulePage();
            });

            document.querySelectorAll('.schedule-filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    scheduleActiveFilter = e.currentTarget.dataset.filter;

        function renderTimerPage() {
            const container = document.getElementById('timer-page');
            const sortedTasks = [...speedCheckTasks].sort((a,b) => (a.name || '').localeCompare(b.name || ''));
            container.innerHTML = `

                    <div class="flex-shrink-0 grid grid-cols-2 gap-4">
                        <button id="timer-stop-btn" class="bg-red-600 text-white font-bold py-5 rounded-lg text-xl disabled:bg-red-800 disabled:opacity-70" disabled>Stop & Save</button>

                    </div>
                </div>
            `;
            
            document.getElementById('timer-stop-btn').addEventListener('click', stopSpeedCheckTimer);
            document.getElementById('timer-control-btn').addEventListener('click', () => {
                if (scTimerState === 'stopped') startSpeedCheckTimer();
                else if (scTimerState === 'running') pauseSpeedCheckTimer();
                else if (scTimerState === 'paused') resumeSpeedCheckTimer();
            });
        }
        
        function renderStatsPage() {
            const container = document.getElementById('stats-page');
            
            const analysisData = speedCheckTasks.map(task => {
                const avgMs = speedCheckAverageTimes[task.name];
                if (!avgMs) return null;
                const masterRate = task.rate || 0;
                const ratePerHour = masterRate > 0 && avgMs > 0 ? (masterRate / (avgMs / 3600000)) : 0;
                const ratePerMinute = ratePerHour / 60;
                const tasksPerHour = avgMs > 0 ? (3600000 / avgMs) : 0;
                return { ...task, avgMs, ratePerHour, ratePerMinute, tasksPerHour };
            }).filter(Boolean).sort((a, b) => b.ratePerHour - a.ratePerHour);

            container.innerHTML = `
                 <div>
                    <h2 class="text-lg font-bold text-gray-700 mb-3">Task Profitability</h2>
                     <div class="bg-white rounded-xl shadow-md overflow-hidden">
                        <div class="overflow-x-auto">

                                    <th class="p-3 font-semibold text-right">Rate/Min</th>
                                    <th class="p-3 font-semibold text-right">Tasks/Hour</th>

                                        <td class="p-3 text-right font-mono text-blue-600">${d.tasksPerHour.toFixed(1)}</td>

        }

            container.innerHTML = `
                 <div class="bg-white p-4 rounded-xl shadow-md">

                        <div>
                            <label for="shop-close-time" class="block text-sm font-medium text-gray-700">Shop Close Time</label>
                            <input type="time" id="shop-close-time" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" value="${shopSchedule.close || '21:00'}">
                        </div>
                        <button id="save-schedule-btn" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg">Save Hours</button>
                     </div>
                </div>
                 <div class="bg-white p-4 rounded-xl shadow-md mt-6">
                     <h2 class="text-lg font-bold text-gray-700 mb-4">Task Management</h2>
                     <div id="manage-tasks-list" class="space-y-2 mb-4 max-h-[40vh] overflow-y-auto border-t pt-4">
                        ${sortedTasks.length > 0 ? sortedTasks.map(task => `
                            <div class="flex items-center justify-between p-2 bg-gray-100 rounded gap-2">
                                <span class="font-medium flex-grow">${task.name}</span>
                                <input type="number" value="${task.rate || 0}" class="text-right border rounded-md px-2 py-1 w-20 text-sm task-rate-input" data-task-id="${task.id}" placeholder="Rate (₹)">
                                <button class="delete-task-btn p-1 text-red-500 hover:bg-red-100 rounded-full" data-task-id="${task.id}" aria-label="Delete task">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                                </button>
                            </div>
                        `).join('') : '<p class="text-center text-gray-500">No tasks defined yet.</p>'}
                    </div>
                    <form id="add-task-form" class="p-4 border-t -mx-4 -mb-4 flex gap-2">
                        <input type="text" id="new-task-name" class="w-full border rounded-md px-3 py-2 text-sm" placeholder="New task name..." required>
                        <input type="number" id="new-task-rate" class="border rounded-md px-3 py-2 w-24 text-sm" placeholder="Rate (₹)">
                        <button type="submit" class="bg-indigo-600 text-white font-semibold rounded-md px-4 py-2 text-sm whitespace-nowrap">Add Task</button>
                    </form>
                </div>
            `;
            document.getElementById('save-schedule-btn').addEventListener('click', saveSchedule);
        }

        // --- Modals ---
        function openModal(id, content) {
            const modal = document.createElement('div');
            modal.id = id;
            modal.className = 'fixed inset-0 z-[150] flex items-center justify-center p-4 modal-overlay';
            modal.innerHTML = `<div class="bg-white rounded-xl shadow-2xl w-full max-w-md modal-content">${content}</div>`;
            
            modal.addEventListener('click', (e) => {
                if(e.target.id === id) closeModal(id); // Close on overlay click
            });
            document.getElementById('modals-container').appendChild(modal);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) {
                const modalContent = modal.querySelector('.modal-content');
                if (modalContent) {
                    const removeModal = () => {
                        if (modal.parentNode) {
                            modal.remove();
                        }
                        modalContent.removeEventListener('transitionend', removeModal);
                    };
                    modalContent.addEventListener('transitionend', removeModal);
                    
                    // Trigger exit animation by applying final state styles inline to override CSS specificity
                    modalContent.style.transform = 'translateY(20px)';
                    modalContent.style.opacity = '0';
                    
                    // Fallback in case transitionend doesn't fire
                    setTimeout(removeModal, 300);
                } else {
                    modal.remove(); // Fallback if there's no modal content
                }
            }
        }

        window.openEtaModal = (orderId) => {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            
            const sortedTasks = [...speedCheckTasks].sort((a,b) => (a.name || '').localeCompare(b.name || ''));
            const content = `
                <div class="p-4">
                    <h3 class="font-bold text-lg mb-4">Set Pickup for #${order.orderNumber}</h3>
                    <form id="eta-form" class="space-y-4">
                        <div>
                             <label for="eta-task-select" class="block text-sm font-medium text-gray-700">Assign Task</label>
                             <select id="eta-task-select" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm">
                                <option value="">-- Select Task --</option>
                                ${sortedTasks.map(t => `<option value="${t.name}">${t.name}</option>`).join('')}
                             </select>
                             <p id="eta-avg-time" class="text-xs text-gray-500 mt-1 h-4"></p>
                        </div>
                         <div>
                            <label for="eta-datetime" class="block text-sm font-medium text-gray-700">Pickup Date & Time</label>
                            <input type="datetime-local" id="eta-datetime" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required>
                        </div>
                        <div class="flex justify-end gap-2 pt-4 border-t">
                            <button type="button" id="eta-modal-cancel-btn" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg">Cancel</button>
                            <button type="submit" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg">Save</button>
                        </div>
                    </form>
                </div>`;
            openModal('eta-modal', content);
            
            document.getElementById('eta-modal-cancel-btn').addEventListener('click', () => closeModal('eta-modal'));

            const taskSelect = document.getElementById('eta-task-select');
            taskSelect.addEventListener('change', () => {
                const avgMs = speedCheckAverageTimes[taskSelect.value];
                document.getElementById('eta-avg-time').textContent = avgMs ? `Avg. time: ${formatMilliseconds(avgMs, true)}` : '';
            });

            document.getElementById('eta-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const taskName = taskSelect.value;
                const datetime = document.getElementById('eta-datetime').value;
                if(taskName && datetime) {
                    saveOrderPickupTime(orderId, taskName, datetime);
                    closeModal('eta-modal');
                } else {
                    showToast('Please select a task and a date/time.', true);
                }
            });
        };

        // --- Firebase Write Ops ---
        async function saveSchedule() {
            const openTime = document.getElementById('shop-open-time').value;
            const closeTime = document.getElementById('shop-close-time').value;
            const today = new Date().toISOString().slice(0, 10);
            try {
                await db.ref(`schedules/${today}`).set({ open: openTime, close: closeTime });
                showToast("Schedule saved.");
            } catch(err) {
                showToast("Error saving schedule.", true);
            }
        }

        async function saveOrderPickupTime(orderId, taskName, datetime) {
            const orderRef = db.ref(`orders/${orderId}`);
            try {
                const etaTimestamp = new Date(datetime).getTime();
                const minutes = Math.round((etaTimestamp - Date.now()) / 60000);
                await orderRef.update({
                    assignedTaskName: taskName,
                    estimatedMinutes: minutes,
                    estimatedCompletionTimestamp: etaTimestamp,
                    pipelineStatus: 'in_progress'
                });
                showToast("Order time saved successfully.");
            } catch(err) {
                showToast("Error saving order time.", true);
            }
        }

        function startSpeedCheckTimer() {
            const taskSelect = document.getElementById('timer-task-select');
            const taskName = taskSelect.value;
            if (!taskName) { showToast("Please select a task first.", true); return; }

            scTimerState = 'running';
            speedCheckTimer = { startTime: Date.now(), accumulatedMs: 0, taskName, isPaused: false };
            speedCheckTimer.intervalId = setInterval(() => {
                const elapsed = speedCheckTimer.accumulatedMs + (Date.now() - speedCheckTimer.startTime);
                document.getElementById('timer-display').textContent = formatMilliseconds(elapsed, true);
            }, 1000);

            document.getElementById('timer-stop-btn').disabled = false;
            document.getElementById('timer-control-btn').textContent = 'Pause';
        }

        function pauseSpeedCheckTimer() {
            if (scTimerState !== 'running') return;
            scTimerState = 'paused';
            clearInterval(speedCheckTimer.intervalId);
            speedCheckTimer.accumulatedMs += (Date.now() - speedCheckTimer.startTime);
            speedCheckTimer.isPaused = true;
            document.getElementById('timer-control-btn').textContent = 'Resume';
        }

        function resumeSpeedCheckTimer() {
            if (scTimerState !== 'paused') return;
            scTimerState = 'running';
            speedCheckTimer.startTime = Date.now();
            speedCheckTimer.isPaused = false;
            speedCheckTimer.intervalId = setInterval(() => {
                const elapsed = speedCheckTimer.accumulatedMs + (Date.now() - speedCheckTimer.startTime);
                document.getElementById('timer-display').textContent = formatMilliseconds(elapsed, true);
            }, 1000);
            document.getElementById('timer-control-btn').textContent = 'Pause';
        }

        async function stopSpeedCheckTimer() {
            if (scTimerState === 'stopped') return;
            clearInterval(speedCheckTimer.intervalId);
            
            const durationMs = speedCheckTimer.isPaused ? speedCheckTimer.accumulatedMs : speedCheckTimer.accumulatedMs + (Date.now() - speedCheckTimer.startTime);
            const task = speedCheckTasks.find(t => t.name === speedCheckTimer.taskName);
            
            const logEntry = { 
                taskName: speedCheckTimer.taskName, 
                durationMs, 
                rate: task ? (task.rate || 0) : 0,
                timestamp: firebase.database.ServerValue.TIMESTAMP 
            };
            
            try {
                await db.ref('speedCheckLogs').push(logEntry);
                showToast(`Logged ${formatMilliseconds(durationMs, true)} for "${speedCheckTimer.taskName}".`);
            } catch (err) {
                showToast("Error saving log.", true);
            }
            
            scTimerState = 'stopped';
            speedCheckTimer = { intervalId: null, startTime: 0, accumulatedMs: 0, taskName: '', isPaused: false };
            document.getElementById('timer-display').textContent = '00:00:00';
            document.getElementById('timer-stop-btn').disabled = true;
            document.getElementById('timer-control-btn').textContent = 'Start';
        }
        
        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();

                db.ref('orders').on('value', snapshot => {
                    const data = snapshot.val() || {};
                    allOrders = Object.entries(data).map(([key, value]) => ({...value, id: key}));
                    runAllUpdaters();
                });
                db.ref('speedCheckLogs').on('value', snapshot => {
                    allSpeedCheckLogs = Object.values(snapshot.val() || {});
                    runAllUpdaters();
                });
                db.ref('speedCheckTasks').on('value', snapshot => {
                    const data = snapshot.val() || {};
                    speedCheckTasks = Object.values(data);
                    if (speedCheckTasks.length === 0 && !snapshot.exists()) {
                         const updates = {};
                         INITIAL_SPEED_CHECK_TASKS.forEach(name => {
                            const newRef = db.ref('speedCheckTasks').push();
                            updates[newRef.key] = { id: newRef.key, name: name, rate: 0 };
                         });
                         db.ref('speedCheckTasks').update(updates);
                    } else {
                        runAllUpdaters();
                    }
                });
                
                document.querySelector('.bottom-nav').addEventListener('click', e => {
                    const navItem = e.target.closest('.nav-item');
                    if(navItem) switchPage(navItem.dataset.page);
                });

                const settingsPage = document.getElementById('settings-page');
                settingsPage.addEventListener('submit', e => {
                    if (e.target.id === 'add-task-form') {
                        e.preventDefault();
                        const name = document.getElementById('new-task-name').value.trim();
                        const rate = parseFloat(document.getElementById('new-task-rate').value) || 0;
                        if (name && !speedCheckTasks.some(t => t.name.toLowerCase() === name.toLowerCase())) {
                            const newRef = db.ref('speedCheckTasks').push();
                            newRef.set({ id: newRef.key, name, rate });
                            e.target.reset();
                        } else {
                            showToast("Task name cannot be empty or already exist.", true);
                        }
                    }
                });
                settingsPage.addEventListener('click', e => {
                    const deleteBtn = e.target.closest('.delete-task-btn');
                    if (deleteBtn) {
                        if (confirm('Are you sure you want to delete this task?')) {
                            db.ref(`speedCheckTasks/${deleteBtn.dataset.taskId}`).remove();
                        }
                    }
                });
                settingsPage.addEventListener('change', e => {
                    const rateInput = e.target.closest('.task-rate-input');
                    if(rateInput) {
                        db.ref(`speedCheckTasks/${rateInput.dataset.taskId}/rate`).set(parseFloat(rateInput.value) || 0);
                    }
                });

                switchPage('home');
            } catch(e) {
                 console.error("Initialization failed:", e);
                 document.body.innerHTML = `<div class="p-8 text-center text-red-500"><h1>Error</h1><p>The application could not be initialized. Please check your Firebase configuration.</p></div>`;
            }
        });
    </script>

        .page { display: none; opacity: 0; transition: opacity 0.2s ease-in-out; }
        .page.active { display: block; opacity: 1; }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: calc(70px + env(safe-area-inset-bottom));

            justify-content: space-around;

            flex-direction: column;
            align-items: center;

        /* Modals & Overlays */
        .modal-overlay { 
            background-color: rgba(0,0,0,0.6); 
            backdrop-filter: blur(2px);
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.3s ease; 
        }
        .modal-overlay.active { 
            opacity: 1; 
            pointer-events: auto; 
        }
        .modal-content { 
            transform: scale(0.95) translateY(10px);

        }
        
        .loader {
            width: 20px; height: 20px; border: 2px solid currentColor;

        function formatMilliseconds(ms, showSeconds = false) {
            if (ms < 0) ms = 0;
            const totalSeconds = Math.floor(ms / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            const seconds = totalSeconds % 60;
            const paddedHours = String(totalHours).padStart(2, '0');
            const paddedMinutes = String(minutes).padStart(2, '0');
            if(showSeconds) {
                return `${paddedHours}:${paddedMinutes}:${String(seconds).padStart(2, '0')}`;
            }
            return `${paddedHours}:${paddedMinutes}`;
        }

        function calculateAverages() {
            const groupedLogs = allSpeedCheckLogs.reduce((acc, log) => {
                if(log.taskName && log.durationMs) {
                    if(!acc[log.taskName]) acc[log.taskName] = { totalMs: 0, count: 0 };
                    acc[log.taskName].totalMs += log.durationMs;
                    acc[log.taskName].count++;
                }
                return acc;
            }, {});
            speedCheckAverageTimes = Object.fromEntries(Object.entries(groupedLogs).map(([name, data]) => [name, data.totalMs / data.count]));

            `;
            
            // Re-attach global handlers
            window.openPerformanceReportModal = openPerformanceReportModal;
            window.openOrderListModal = openOrderListModal;
        }
        
        // --- Order List Modal for Home Page ---
        function openOrderListModal(title, type) {
            const now = Date.now();
            const startOfDay = new Date().setHours(0,0,0,0);
            const endOfDay = new Date().setHours(23,59,59,999);
            
            const todayOrders = allOrders.filter(o => o.estimatedCompletionTimestamp >= startOfDay && o.estimatedCompletionTimestamp <= endOfDay);
            
            let list = [];
            let headerColor = "bg-gray-100 text-gray-800";

            if (type === 'total') {
                list = todayOrders;
                headerColor = "bg-blue-100 text-blue-900";
            } else if (type === 'completed') {
                list = todayOrders.filter(o => o.pipelineStatus === 'handover' || o.status === 'Completed' || o.status === 'Delivered');
                headerColor = "bg-green-100 text-green-900";
            } else {
                const incomplete = todayOrders.filter(o => !(o.pipelineStatus === 'handover' || o.status === 'Completed' || o.status === 'Delivered'));
                if (type === 'overdue') {
                    list = incomplete.filter(o => o.estimatedCompletionTimestamp < now);
                    headerColor = "bg-red-100 text-red-900";
                } else if (type === 'pending') {
                    list = incomplete.filter(o => o.estimatedCompletionTimestamp >= now);
                    headerColor = "bg-yellow-100 text-yellow-900";
                }
            }
            
            list.sort((a,b) => (a.estimatedCompletionTimestamp || 0) - (b.estimatedCompletionTimestamp || 0));

            const listHtml = list.length > 0 ? list.map(o => {
                const eta = new Date(o.estimatedCompletionTimestamp);
                const isLate = o.estimatedCompletionTimestamp < now && !(o.pipelineStatus === 'handover' || o.status === 'Completed');
                
                return `
                <div class="p-3 border-b last:border-b-0 flex justify-between items-center ${isLate ? 'bg-red-50' : 'hover:bg-gray-50'}">
                    <div>
                        <div class="font-bold text-gray-800">#${o.orderNumber} - ${o.customerName}</div>
                        <div class="text-xs text-gray-500 flex gap-2">
                            <span>Task: ${o.assignedTaskName || 'N/A'}</span>
                            <span class="${isLate ? 'text-red-600 font-bold' : ''}">Due: ${eta.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                    </div>
                    <div>
                        ${type !== 'completed' ? `<button onclick="openEtaModal('${o.id}')" class="text-indigo-600 font-semibold text-xs border border-indigo-200 bg-indigo-50 px-2 py-1 rounded">Edit</button>` : '<span class="text-green-600 text-xs font-bold">Done</span>'}
                    </div>
                </div>`;
            }).join('') : '<div class="p-6 text-center text-gray-500">No orders in this category.</div>';

            const modalContent = `
                <div class="flex flex-col h-[70vh]">
                    <div class="flex justify-between items-center p-4 rounded-t-xl ${headerColor}">
                        <h3 class="font-bold text-lg">${title} (${list.length})</h3>
                        <button id="close-order-list-modal" class="text-2xl opacity-70 hover:opacity-100">&times;</button>
                    </div>
                    <div class="flex-grow overflow-y-auto bg-white">
                        ${listHtml}
                    </div>
                </div>
            `;
            
            openModal('order-list-modal', modalContent);
            document.getElementById('close-order-list-modal').addEventListener('click', () => closeModal('order-list-modal'));
        }

        // --- Schedule Page ---
        function renderSchedulePage() {
            const container = document.getElementById('schedule-page');
            
            let filteredOrders = allOrders;
            if (scheduleSearchQuery) {
                const query = scheduleSearchQuery.toLowerCase();
                filteredOrders = allOrders.filter(o => 
                    (o.orderNumber && String(o.orderNumber).toLowerCase().includes(query)) ||
                    (o.customerName && o.customerName.toLowerCase().includes(query))
                );
            }

            filteredOrders.sort((a,b) => {
                if (scheduleSortOption === 'eta-asc') return (a.estimatedCompletionTimestamp || 0) - (b.estimatedCompletionTimestamp || 0);
                if (scheduleSortOption === 'eta-desc') return (b.estimatedCompletionTimestamp || 0) - (a.estimatedCompletionTimestamp || 0);
                if (scheduleSortOption === 'name-asc') return (a.customerName || '').localeCompare(b.customerName || '');
                return 0;
            });

            const toSchedule = filteredOrders.filter(o => o.pipelineStatus === 'new' || !o.pipelineStatus || o.status === 'Pending');
            const upcoming = filteredOrders.filter(o => o.pipelineStatus === 'in_progress');

            container.innerHTML = `
                <div class="sticky top-[-1rem] bg-gray-100 pt-4 pb-4 z-10 -mx-4 px-4 border-b border-gray-200 shadow-sm">
                    <div class="flex gap-2 mb-2">
                        <input type="search" id="schedule-search-input" placeholder="Search by Order # or Name..." class="app-input flex-grow" value="${scheduleSearchQuery}">
                        <select id="schedule-sort-select" class="app-input w-auto">
                            <option value="eta-asc" ${scheduleSortOption==='eta-asc'?'selected':''}>Deadline: Earliest</option>
                            <option value="eta-desc" ${scheduleSortOption==='eta-desc'?'selected':''}>Deadline: Latest</option>
                            <option value="name-asc" ${scheduleSortOption==='name-asc'?'selected':''}>Name: A-Z</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <button class="schedule-filter-btn flex-1 py-2 px-3 text-sm font-semibold rounded-lg ${scheduleActiveFilter === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}" data-filter="all">All (${toSchedule.length + upcoming.length})</button>
                        <button class="schedule-filter-btn flex-1 py-2 px-3 text-sm font-semibold rounded-lg ${scheduleActiveFilter === 'to-schedule' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}" data-filter="to-schedule">To Schedule (${toSchedule.length})</button>
                        <button class="schedule-filter-btn flex-1 py-2 px-3 text-sm font-semibold rounded-lg ${scheduleActiveFilter === 'upcoming' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700'}" data-filter="upcoming">Upcoming (${upcoming.length})</button>
                    </div>
                </div>
                
                <div id="schedule-lists-container" class="mt-4 space-y-8">
                    ${(scheduleActiveFilter === 'all' || scheduleActiveFilter === 'to-schedule') ? `
                    <div>
                        <h2 class="text-lg font-bold text-gray-700 mb-3">Orders to Schedule (${toSchedule.length})</h2>
                        <div id="to-schedule-list" class="space-y-3">
                            ${toSchedule.length > 0 ? toSchedule.map(order => `
                                <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200">
                                    <div class="flex justify-between items-center">
                                        <p class="font-semibold">#${order.orderNumber || 'N/A'} - ${order.customerName}</p>
                                        <button onclick="openEtaModal('${order.id}')" class="bg-indigo-100 text-indigo-700 font-semibold text-xs py-1 px-3 rounded-full hover:bg-indigo-200">Set Time</button>
                                    </div>
                                </div>
                            `).join('') : '<p class="bg-white p-4 rounded-lg text-sm text-center text-gray-500">All new orders are scheduled!</p>'}
                        </div>
                    </div>` : ''}

                    ${(scheduleActiveFilter === 'all' || scheduleActiveFilter === 'upcoming') ? `
                    <div>
                        <h2 class="text-lg font-bold text-gray-700 mb-3">Upcoming Deadlines (${upcoming.length})</h2>
                        <div id="upcoming-list" class="space-y-3">
                            ${upcoming.length > 0 ? upcoming.map(order => {
                                const eta = new Date(order.estimatedCompletionTimestamp);
                                const remainingMs = eta - Date.now();
                                const isOverdue = remainingMs < 0;
                                return `
                                <div class="bg-white p-3 rounded-lg shadow-sm border-l-4 ${isOverdue ? 'border-red-500 overdue-alert' : 'border-blue-500'}">
                                    <div class="flex justify-between items-center">
                                        <p class="font-semibold">#${order.orderNumber} - ${order.customerName}</p>
                                        <div class="flex items-center gap-2">
                                            <p class="text-xs font-semibold ${isOverdue ? 'text-red-600' : 'text-blue-600'}">${eta.toLocaleDateString()} @ ${eta.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                            <button class="text-red-500 hover:text-red-700 p-1 unschedule-btn" data-order-id="${order.id}" title="Unschedule">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                                            </button>
                                        </div>
                                    </div>
                                    <p class="text-sm mt-1 text-gray-600">Task: ${order.assignedTaskName || 'N/A'}</p>
                                </div>
                                `;
                            }).join('') : '<p class="bg-white p-4 rounded-lg text-sm text-center text-gray-500">No orders currently in progress.</p>'}
                        </div>
                    </div>` : ''}
                </div>
            `;

            // Re-attach listeners after rendering
            document.getElementById('schedule-search-input').addEventListener('input', (e) => { scheduleSearchQuery = e.target.value; renderSchedulePage(); });
            document.getElementById('schedule-sort-select').addEventListener('change', (e) => { scheduleSortOption = e.target.value; renderSchedulePage(); });
            document.querySelectorAll('.schedule-filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { scheduleActiveFilter = e.currentTarget.dataset.filter; renderSchedulePage(); });
            });
            
            // Unschedule action delegated listener
            document.getElementById('schedule-lists-container').addEventListener('click', (e) => {
                const unscheduleBtn = e.target.closest('.unschedule-btn');
                if (unscheduleBtn) {
                    const orderId = unscheduleBtn.dataset.orderId;
                    showDeleteConfirm(() => {
                        db.ref(`orders/${orderId}`).update({ pipelineStatus: 'new', assignedTaskName: null, estimatedCompletionTimestamp: null }).then(() => {
                            showToast("Order unscheduled.");
                            notifiedOverdueOrders.delete(orderId); // Reset notification status
                        });
                    }, "Unschedule Order?", "This will remove the deadline and move it back to the 'To Schedule' list.");
                }
            });
        }

        // --- Timer Page ---
        function renderTimerPage() { 
             const container = document.getElementById('timer-page');
             let sortedTasks = [...speedCheckTasks].sort((a,b) => (a.name || '').localeCompare(b.name || ''));
             if (timerSearchQuery) sortedTasks = sortedTasks.filter(t => t.name.toLowerCase().includes(timerSearchQuery.toLowerCase()));
             
             const tasksHtml = sortedTasks.map(task => {
                // IMPORTANT: activeTimers stores data keyed by task.id.
                // We must check if THIS SPECIFIC task is the one in the object.
                const timerState = activeTimers[task.id];
                const isActive = timerState && !timerState.isPaused;
                const isPaused = timerState && timerState.isPaused;
                
                let timerDisplay = "00:00:00";
                if (timerState) {
                    const elapsed = timerState.accumulatedMs + (timerState.isPaused ? 0 : (Date.now() - timerState.startTime));
                    timerDisplay = formatMilliseconds(elapsed, true);
                }
                
                let cardClass = "bg-white border border-gray-200";
                let statusBadge = "";
                
                if (isActive) {
                    cardClass = "bg-green-50 border-green-500 active-task shadow-lg transform scale-[1.01]";
                    statusBadge = `<span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">RUNNING</span>`;
                } else if (isPaused) {
                    cardClass = "bg-yellow-50 border-yellow-500 paused-task";
                    statusBadge = `<span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded">PAUSED</span>`;
                } else {
                    cardClass = "bg-white border border-gray-200 opacity-90";
                }
                
                const escapedTaskName = task.name.replace(/'/g, "\\'"); 

                return `
                <div class="${cardClass} p-4 rounded-xl shadow-sm flex flex-col gap-3 transition-all duration-300" id="task-card-${task.id}">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-bold text-gray-800 text-lg">${task.name}</h3>
                                ${statusBadge}
                            </div>
                            <p class="text-sm text-gray-500">Rate: ₹${task.rate || 0}</p>
                        </div>
                        <div class="text-right">
                            <div id="timer-display-${task.id}" class="digital-font text-2xl font-bold ${isActive ? 'text-green-600' : (isPaused ? 'text-yellow-600' : 'text-gray-400')}">
                                ${timerDisplay}
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mt-2">
                        ${isActive 
                            ? `<button class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 rounded-lg" onclick="pauseSpeedCheckTimer('${task.id}')">Pause</button>`
                            : `<button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg" onclick="startSpeedCheckTimer('${task.id}', '${escapedTaskName}')">${isPaused ? 'Resume' : 'Start'}</button>`
                        }
                        <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg ${(isActive || isPaused) ? '' : 'opacity-50 cursor-not-allowed'}" 
                                onclick="${(isActive || isPaused) ? `stopSpeedCheckTimer('${task.id}')` : ''}" 
                                ${(isActive || isPaused) ? '' : 'disabled'}>
                            Stop & Save
                        </button>
                    </div>
                </div>`;
            }).join('');

            container.innerHTML = `
                <div class="sticky top-0 bg-gray-100 pb-4 z-10 -mt-2 pt-2 space-y-4">
                    <div class="bg-gray-900 text-white p-6 rounded-2xl shadow-lg text-center relative overflow-hidden">
                        <div class="relative z-10">
                            <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Current Time</p>
                            <div id="digital-clock" class="digital-font text-5xl font-black tracking-tight">--:--:--</div>
                            <div class="text-sm text-gray-400 mt-1" id="digital-date">...</div>
                        </div>
                        <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-indigo-500 opacity-20 blur-2xl"></div>
                        <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-32 h-32 rounded-full bg-purple-500 opacity-20 blur-2xl"></div>
                    </div>
                    <input type="search" id="timer-search-input" placeholder="Search tasks..." class="app-input" value="${timerSearchQuery}">
                </div>
                <div class="space-y-4 pb-20">${tasksHtml.length > 0 ? tasksHtml : '<p class="text-center text-gray-500 py-10">No tasks found.</p>'}</div>
            `;
            document.getElementById('timer-search-input').addEventListener('input', (e) => { timerSearchQuery = e.target.value; renderTimerPage(); });
            startClock();
        }
        
        function startClock() {
            if (globalClockInterval) clearInterval(globalClockInterval);
            const updateClock = () => {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit' });
                const headerClock = document.getElementById('digital-clock-header');
                const pageClock = document.getElementById('digital-clock');
                const pageDate = document.getElementById('digital-date');
                
                if (headerClock) headerClock.textContent = timeStr;
                if (pageClock) pageClock.textContent = timeStr;
                if (pageDate) pageDate.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                
                // Check deadlines periodically
                checkDeadlines();
            };
            updateClock();
            globalClockInterval = setInterval(updateClock, 1000);
        }

        // --- Stats & Log Manager ---
        function renderStatsPage() {
            const container = document.getElementById('stats-page');
            const now = new Date();
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()).getTime();
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            
            let filteredLogs = allSpeedCheckLogs;
            if (statsTimeFilter === 'today') filteredLogs = allSpeedCheckLogs.filter(l => l.timestamp >= startOfDay);
            else if (statsTimeFilter === 'week') filteredLogs = allSpeedCheckLogs.filter(l => l.timestamp >= startOfWeek);
            else if (statsTimeFilter === 'month') filteredLogs = allSpeedCheckLogs.filter(l => l.timestamp >= startOfMonth);

            const localAverages = {};
            filteredLogs.forEach(log => {
                if(log.taskName && log.durationMs) {
                    if(!localAverages[log.taskName]) localAverages[log.taskName] = { total: 0, count: 0 };
                    localAverages[log.taskName].total += log.durationMs;
                    localAverages[log.taskName].count++;
                }
            });

            const analysisData = speedCheckTasks.map(task => {
                const data = localAverages[task.name];
                if (!data) return null;
                const avgMs = data.total / data.count;
                const masterRate = task.rate || 0;
                const ratePerHour = masterRate > 0 && avgMs > 0 ? (masterRate / (avgMs / 3600000)) : 0;
                const ratePerMinute = ratePerHour / 60;
                const tasksPerHour = avgMs > 0 ? (3600000 / avgMs) : 0;
                return { ...task, avgMs, ratePerHour, ratePerMinute, tasksPerHour };
            }).filter(Boolean).sort((a, b) => b.ratePerHour - a.ratePerHour);

            const escapedTaskName = (name) => name.replace(/'/g, "\\'");

            container.innerHTML = `
                 <div>
                    <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                        <h2 class="text-lg font-bold text-gray-700">Task Profitability</h2>
                        <div class="flex bg-gray-200 rounded-lg p-1 gap-1">
                            <button class="px-3 py-1 text-xs rounded-md font-medium transition-colors ${statsTimeFilter === 'today' ? 'bg-white shadow text-indigo-600' : 'text-gray-600 hover:bg-gray-300'}" onclick="setStatsFilter('today')">Today</button>
                            <button class="px-3 py-1 text-xs rounded-md font-medium transition-colors ${statsTimeFilter === 'week' ? 'bg-white shadow text-indigo-600' : 'text-gray-600 hover:bg-gray-300'}" onclick="setStatsFilter('week')">Week</button>
                            <button class="px-3 py-1 text-xs rounded-md font-medium transition-colors ${statsTimeFilter === 'month' ? 'bg-white shadow text-indigo-600' : 'text-gray-600 hover:bg-gray-300'}" onclick="setStatsFilter('month')">Month</button>
                            <button class="px-3 py-1 text-xs rounded-md font-medium transition-colors ${statsTimeFilter === 'all' ? 'bg-white shadow text-indigo-600' : 'text-gray-600 hover:bg-gray-300'}" onclick="setStatsFilter('all')">All</button>
                        </div>
                    </div>
                     <div class="bg-white rounded-xl shadow-md overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead class="bg-gray-50"><tr class="text-left"><th class="p-3 font-semibold">Task</th><th class="p-3 font-semibold text-right">Avg. Time</th><th class="p-3 font-semibold text-right">Rate/Hour</th><th class="p-3 font-semibold text-right">History</th></tr></thead>
                                <tbody>
                                ${analysisData.length > 0 ? analysisData.map(d => `
                                    <tr class="border-t">
                                        <td class="p-3 font-medium">${d.name}</td>
                                        <td class="p-3 text-right font-mono">${formatMilliseconds(d.avgMs, true)}</td>
                                        <td class="p-3 text-right font-mono font-bold text-green-600">₹${d.ratePerHour.toFixed(2)}</td>
                                        <td class="p-3 text-right"><button onclick="openLogManager('${escapedTaskName(d.name)}')" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-3 py-1 rounded text-xs font-semibold">Manage Logs</button></td>
                                    </tr>
                                `).join('') : '<tr><td colspan="5" class="p-6 text-center text-gray-500">No timed tasks with rates found.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Log Manager Modal ---
        function openLogManager(taskName) { renderLogManagerModal(taskName); }

        function renderLogManagerModal(taskName, searchQuery = '', dateFilter = '') {
            let logsForTask = allSpeedCheckLogs.filter(log => log.taskName === taskName);
            if (searchQuery) { const q = searchQuery.toLowerCase(); logsForTask = logsForTask.filter(log => new Date(log.timestamp).toLocaleString().toLowerCase().includes(q) || formatMilliseconds(log.durationMs, true).toLowerCase().includes(q)); }
            if (dateFilter) { const filterDate = new Date(dateFilter).setHours(0,0,0,0); logsForTask = logsForTask.filter(log => new Date(log.timestamp).setHours(0,0,0,0) === filterDate); }
            logsForTask.sort((a,b) => b.timestamp - a.timestamp);
            
            const existingModal = document.getElementById('log-manager-modal');
            const tbodyContent = logsForTask.length > 0 ? logsForTask.map(log => `
                <tr class="border-b" id="log-row-${log.id}">
                    <td class="p-2 text-center"><input type="checkbox" class="log-checkbox w-4 h-4 text-indigo-600 rounded" data-log-id="${log.id}"></td>
                    <td class="p-2 text-gray-600 text-xs">${new Date(log.timestamp).toLocaleString()}</td>
                    <td class="p-2 text-right font-mono font-semibold">${formatMilliseconds(log.durationMs, true)}</td>
                    <td class="p-2 text-center flex justify-center gap-2">
                        <button class="delete-log-btn text-red-500 hover:text-red-700 p-2 rounded-full hover:bg-red-50" data-delete-type="log" data-id="${log.id}" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </td>
                </tr>`).join('') : '<tr><td colspan="4" class="p-4 text-center text-gray-500">No logs found.</td></tr>';

            const modalBodyHTML = `
                <div class="p-4 flex flex-col h-[80vh]">
                    <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg truncate pr-2">History: ${taskName}</h3><button id="close-log-manager" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button></div>
                    <div class="flex gap-2 mb-3"><input type="search" id="log-search" placeholder="Search..." class="app-input flex-grow text-xs" value="${searchQuery}"><input type="date" id="log-date-filter" class="app-input w-auto text-xs" value="${dateFilter}"></div>
                    <div class="flex justify-between items-center mb-2"><div class="flex items-center"><input type="checkbox" id="select-all-logs-checkbox" class="w-4 h-4 text-indigo-600 rounded mr-2"><span class="text-xs text-gray-500">Select All</span></div><button id="delete-selected-logs-btn" class="bg-red-500 text-white font-semibold py-1 px-3 rounded text-xs disabled:opacity-50 disabled:cursor-not-allowed" disabled>Delete Selected</button></div>
                    <div class="flex-grow overflow-y-auto border rounded-lg"><table class="w-full text-sm text-left"><thead class="bg-gray-100 sticky top-0"><tr><th class="p-2 w-8"></th><th class="p-2">Date</th><th class="p-2 text-right">Duration</th><th class="p-2 text-center">Actions</th></tr></thead><tbody id="logs-table-body">${tbodyContent}</tbody></table></div>
                </div>`;

            if (existingModal) {

        // --- TIMER LOGIC (UPDATED: Single Tasking) ---
        function startSpeedCheckTimer(taskId, taskName) {
            // Force pause on any OTHER active task to prevent multi-tasking confusion
            Object.keys(activeTimers).forEach(id => {
                if (id !== taskId && activeTimers[id] && !activeTimers[id].isPaused) {
                    pauseSpeedCheckTimer(id);
                }
            });

            if (activeTimers[taskId] && !activeTimers[taskId].isPaused) return; 
            
            activeTimers[taskId] = { 
                taskId: taskId, 
                taskName: taskName, 
                startTime: Date.now(), 
                accumulatedMs: activeTimers[taskId] ? activeTimers[taskId].accumulatedMs : 0, 
                isPaused: false, 
                intervalId: setInterval(() => updateTaskTimerDisplay(taskId), 1000) 
            };
            
            renderTimerPage();
        }

        function pauseSpeedCheckTimer(taskId) {
            const timer = activeTimers[taskId];
            if (timer && !timer.isPaused) { 
                clearInterval(timer.intervalId); 
                timer.intervalId = null; 
                timer.isPaused = true; 
                timer.accumulatedMs += (Date.now() - timer.startTime); 
                renderTimerPage(); 
            }
        }

        async function stopSpeedCheckTimer(taskId) {
            const timer = activeTimers[taskId];
            if (!timer) return;
            if (timer.intervalId) clearInterval(timer.intervalId);
            
            const durationMs = timer.isPaused ? timer.accumulatedMs : timer.accumulatedMs + (Date.now() - timer.startTime);
            const task = speedCheckTasks.find(t => t.id === taskId);
            
            const logEntry = { 
                taskName: timer.taskName, 
                durationMs, 
                rate: task ? (task.rate || 0) : 0, 
                timestamp: firebase.database.ServerValue.TIMESTAMP 
            };
            
            try { 
                await db.ref('speedCheckLogs').push(logEntry); 
                showToast(`Saved: ${formatMilliseconds(durationMs, true)} for "${timer.taskName}".`); 
            } catch (err) { 
                showToast("Error saving log.", true); 
            }
            
            delete activeTimers[taskId];
            renderTimerPage();
        }

        function updateTaskTimerDisplay(taskId) {
            const timer = activeTimers[taskId];
            const el = document.getElementById(`timer-display-${taskId}`);
            if (timer && el) { 
                const elapsed = timer.accumulatedMs + (Date.now() - timer.startTime); 
                el.textContent = formatMilliseconds(elapsed, true); 
            }
        }

                list = todayOrders.filter(o => o.pipelineStatus === 'handover' || o.status === 'Completed' || o.status === 'Delivered');
                headerColor = "bg-green-100 text-green-900";
            } else {
                const incomplete = todayOrders.filter(o => !(o.pipelineStatus === 'handover' || o.status === 'Completed' || o.status === 'Delivered'));
                if (type === 'overdue') {
                    list = incomplete.filter(o => o.estimatedCompletionTimestamp < now);
                    headerColor = "bg-red-100 text-red-900";
                } else if (type === 'pending') {
                    list = incomplete.filter(o => o.estimatedCompletionTimestamp >= now);
                    headerColor = "bg-yellow-100 text-yellow-900";
                }
            }
            
            list.sort((a,b) => (a.estimatedCompletionTimestamp || 0) - (b.estimatedCompletionTimestamp || 0));

            const listHtml = list.length > 0 ? list.map(o => {
                const eta = new Date(o.estimatedCompletionTimestamp);
                const isLate = o.estimatedCompletionTimestamp < now && !(o.pipelineStatus === 'handover' || o.status === 'Completed');
                
                return `
                <div class="p-3 border-b last:border-b-0 flex justify-between items-center ${isLate ? 'bg-red-50' : 'hover:bg-gray-50'}">
                    <div>
                        <div class="font-bold text-gray-800">#${o.orderNumber} - ${o.customerName}</div>
                        <div class="text-xs text-gray-500 flex gap-2">
                            <span>Task: ${o.assignedTaskName || 'N/A'}</span>
                            <span class="${isLate ? 'text-red-600 font-bold' : ''}">Due: ${eta.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                    </div>
                    <div>
                        ${type !== 'completed' ? `<button onclick="openEtaModal('${o.id}')" class="text-indigo-600 font-semibold text-xs border border-indigo-200 bg-indigo-50 px-2 py-1 rounded">Edit</button>` : '<span class="text-green-600 text-xs font-bold">Done</span>'}
                    </div>
                </div>`;
            }).join('') : '<div class="p-6 text-center text-gray-500">No orders in this category.</div>';

            const modalContent = `
                <div class="flex flex-col h-[70vh]">
                    <div class="flex justify-between items-center p-4 rounded-t-xl ${headerColor}">
                        <h3 class="font-bold text-lg">${title} (${list.length})</h3>
                        <button id="close-order-list-modal" class="text-2xl opacity-70 hover:opacity-100">&times;</button>
                    </div>
                    <div class="flex-grow overflow-y-auto bg-white">
                        ${listHtml}
                    </div>
                </div>
            `;
            
            openModal('order-list-modal', modalContent);
            document.getElementById('close-order-list-modal').addEventListener('click', () => closeModal('order-list-modal'));
        }
    </script>
